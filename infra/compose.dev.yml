name: teapremium-dev

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Copy infra/.env.example to infra/.env and set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Copy infra/.env.example to infra/.env and set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy infra/.env.example to infra/.env and set POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"
      DOTNET_USE_POLLING_FILE_WATCHER: "1"
      DOTNET_WATCH_SUPPRESS_STATIC_FILE_HANDLING: "1"
      DOTNET_WATCH_RESTART_ON_RUDE_EDIT: "1"
      # Development-only: .NET reads ConnectionStrings:Default from environment.
      # Do not print `docker compose config` without --quiet: it reveals credentials.
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=${POSTGRES_DB:?POSTGRES_DB is required};Username=${POSTGRES_USER:?POSTGRES_USER is required};Password=\"${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}\""
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ../backend
          target: /workspace/backend
          initial_sync: true
          ignore:
            - "**/bin/"
            - "**/obj/"

  store:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: store
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${STORE_PORT:-3000}:3000"
    develop:
      watch:
        - action: sync
          path: ../apps/store/src
          target: /workspace/apps/store/src
          initial_sync: true
        - action: sync
          path: ../packages/api-client/src
          target: /workspace/packages/api-client/src
          initial_sync: true
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: admin
    environment:
      API_INTERNAL_URL: http://api:8080
      PORT: "3001"
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${ADMIN_PORT:-3001}:3001"
    develop:
      watch:
        - action: sync
          path: ../apps/admin/src
          target: /workspace/apps/admin/src
          initial_sync: true
        - action: sync
          path: ../packages/api-client/src
          target: /workspace/packages/api-client/src
          initial_sync: true
    depends_on:
      api:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
